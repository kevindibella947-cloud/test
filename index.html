    .stat-card { background: #0b0b0e; border: 1px solid #272736; padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; }
    .coins { color: #eab308; }
    .platabux { color: #3b82f6; }

    .input-group { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: #a855f7; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
    input { width: 100%; padding: 12px; background: #0b0b0e; border: 1px solid #272736; border-radius: 6px; color: white; font-size: 14px; outline: none; }

    #msg { font-size: 13px; margin-top: 15px; display: none; padding: 8px; border-radius: 6px; }

    /* HUB GIOCHI */

    .counter-container { font-size: 2.2rem; font-weight: bold; margin-bottom: 10px; color: #ffffff; }
    .progress-info { font-size: 14px; color: #eab308; margin-bottom: 20px; font-weight: bold; }

    .btn-wrapper { position: relative; margin-bottom: 20px; }
    .click-btn { padding: 25px 50px; font-size: 1.8rem; font-weight: bold; color: white; background: linear-gradient(145deg, #007bff, #0056b3); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4); outline: none; user-select: none; }

    .empty-msg { text-align: center; color: #888; font-style: italic; }
