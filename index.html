<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Platform - Official Hub</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- GameMonetize SDK Integrato -->
  <script type="text/javascript">
     window.SDK_OPTIONS = {
        gameId: "SOSTITUISCI_CON_IL_TUO_GAME_ID_GAMEMONETIZE",
        onEvent: function (a) {
           switch (a.name) {
              case "SDK_GAME_PAUSE":
                 window.isGamePaused = true;
                 console.log("GameMonetize: Gioco/Hub in Pausa");
                 break;
              case "SDK_GAME_START":
                 window.isGamePaused = false;
                 console.log("GameMonetize: Ripresa");
                 break;
              case "SDK_READY":
                 console.log("GameMonetize SDK Pronto!");
                 break;
           }
        }
     };
     (function (a, b, c) {
        var d = a.getElementsByTagName(b)[0];
        a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
     })(document, "script", "gamemonetize-sdk");
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      background: #0f1219;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header e Profilo Utente */
    header {
      background: #181d29;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(0, 229, 255, 0.2);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #00e5ff;
      letter-spacing: 1px;
    }

    .user-stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .stat-badge {
      background: #22293a;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .platabux { color: #ffd700; }
    .coins { color: #00ff88; }

    /* Layout Principale dell'Hub */
    main {
      flex: 1;
      padding: 40px 30px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
      border-left: 4px solid #00e5ff;
      padding-left: 10px;
    }

    /* Griglia dei Minigiochi */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .game-card {
      background: #181d29;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: #00e5ff;
    }

    .game-thumb {
      width: 100%;
      height: 160px;
      background: #252d3f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .game-info {
      padding: 18px;
    }

    .game-info h3 {
      margin-bottom: 6px;
      font-size: 18px;
    }

    .game-info p {
      font-size: 13px;
      color: #949db1;
      margin-bottom: 15px;
    }

    /* Bottoni e Interazioni */
    .btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-reward {
      background: linear-gradient(135deg, #ff9900, #ff5500);
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      font-size: 16px;
    }

    /* Modal / Iframe del Gioco */
    #game-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      flex-direction: column;
    }

    #game-modal-header {
      background: #181d29;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #game-iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    .close-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header dell'Hub -->
  <header>
    <div class="logo">BLOX PLATFORM HUB</div>
    <div class="user-stats">
      <div class="stat-badge platabux">Platabux: <span id="hub-platabux">0</span></div>
      <div class="stat-badge coins">Coins: <span id="hub-coins">0</span></div>
    </div>
  </header>

  <!-- Contenuto Principale -->
  <main>
    <h2 class="section-title">Minigiochi Disponibili</h2>
    
    <div class="games-grid">
      
      <!-- Minigioco 1: Clicker 3D -->
      <div class="game-card" onclick="launchGame('clicker.html')">
        <div class="game-thumb">🖱️</div>
        <div class="game-info">
          <h3>Blox Clicker 3D</h3>
          <p>Clicca l'avatar 3D, compra potenziamenti e accumula Platabux!</p>
          <button class="btn">Gioca Ora</button>
        </div>
      </div>

      <!-- Minigioco 2: In Arrivo / Espansione -->
      <div class="game-card">
        <div class="game-thumb">🕹️</div>
        <div class="game-info">
          <h3>Blox Runner</h3>
          <p>Evita gli ostacoli e raccogli monete in questo runner 3D.</p>
          <button class="btn" style="background:#3a4153; cursor:not-allowed;" disabled>In Arrivo</button>
        </div>
      </div>

    </div>

    <!-- Modulo Riscatto Pubblicità dell'Hub -->
    <h2 class="section-title">Ricompense Esterne</h2>
    <button class="btn btn-reward" onclick="showRewardAdHub()">
      🎬 Guarda Pubblicità per +250 Platabux Gratis
    </button>
  </main>

  <!-- Modal Screen per eseguire il Minigioco scelto -->
  <div id="game-modal">
    <div id="game-modal-header">
      <span id="modal-game-title" style="font-weight: bold;">Blox Platform Game</span>
      <button class="close-btn" onclick="closeGame()">Chiudi Gioco</button>
    </div>
    <iframe id="game-iframe" src=""></iframe>
  </div>

  <script>
    // --- 1. CONFIGURAZIONE FIREBASE ---
    const firebaseConfig = {
      apiKey: "INSERISCI_TUA_API_KEY",
      authDomain: "tuo-progetto.firebaseapp.com",
      databaseURL: "https://tuo-progetto-default-rtdb.firebaseio.com",
      projectId: "tuo-progetto",
      storageBucket: "tuo-progetto.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };
